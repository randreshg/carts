# -*- Python -*-
# Multinode E2E tests compile under samples/arts_multinode.cfg (2 local
# processes on TCP loopback). Distribution is default-on for multinode
# configs, so no opt-in flag is needed.
#
# Tests live here only after the underlying sample passes single-node and the
# distributed-scope gates mark its primary DBs distributed. Adding a multinode
# test before that point produces no signal: the runtime silently runs
# single-node when no DB is marked distributed.

config.suffixes = [".c", ".cpp"]

# The local multinode runtime binds fixed loopback ports from
# samples/arts_multinode.cfg. Keep this suite serialized even when llvm-lit is
# invoked with a parallel job count.
lit_config.parallelism_groups["carts_multinode_e2e"] = 1
config.parallelism_group = "carts_multinode_e2e"
